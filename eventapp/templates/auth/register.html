{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-3">Регистрация</h3>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">ФИО</label>
                    <input type="text" name="full_name" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    <input type="text" name="phone" class="form-control" placeholder="+7 900 000-00-00">
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" minlength="6" required>
                    <div class="form-text">Не менее 6 символов.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Роль</label>
                    <select name="role" class="form-select">
                        <option value="participant">Участник — регистрируюсь на мероприятия</option>
                        <option value="organizer">Организатор — создаю мероприятия</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-brand w-100">Зарегистрироваться</button>
            </form>
            <p class="mt-3 mb-0 text-center">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}
